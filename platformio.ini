[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.8
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0

; C5 Waveshare board is built by Arduino-CLI instead of PlatformIO:
; PlatformIO 8.0.0 lacks framework-arduinoespressif32-esp32c5-libs.
; See docs/WAVESHARE-C5.md, .github/workflows/ci.yml and SquachEmit.ino.


; ESP32-2432S032R / E32R32P: 3.2-inch ST7798/ST7789-compatible panel.
; Copy pin/HSPI/resistive-touch configuration from SquachWatch-CYD's proven
; cyd32-st7798 profile. This is SquachEmit, NOT SquachWatch firmware.
; Distinct ESP32-WROOM 4MB board; no PSRAM framebuffer is needed.
[env:cyd32-st7798]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  h2zero/NimBLE-Arduino@2.5.1
build_unflags =
  -DILI9341_DRIVER
  -DST7796_DRIVER
build_flags =
  -DSQE_CYD32=1
  -DUSER_SETUP_LOADED=1
  -include $PROJECT_DIR/include/cyd32_st7798_user_setup.h
  -DCORE_DEBUG_LEVEL=0
