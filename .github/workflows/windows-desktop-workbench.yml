name: SquachEmit Windows Desktop Workbench

on:
  push:
    branches:
      - feature/windows-desktop-control-center-20261112
    paths:
      - 'desktop/**'
      - 'workbench/**'
      - 'tests/cases.json'
      - '.github/workflows/windows-desktop-workbench.yml'
  pull_request:
    branches:
      - feature/detection-workbench-v1-20261111
    paths:
      - 'desktop/**'
      - 'workbench/**'
      - 'tests/cases.json'
      - '.github/workflows/windows-desktop-workbench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Windows Workbench source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local desktop contract and 172-case catalog
        working-directory: desktop
        run: npm test
      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build NSIS installer and portable Windows x64 EXE
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload Windows EXE files for hardware review
        uses: actions/upload-artifact@v4
        with:
          name: SquachEmit-Workbench-LCD-Mirror-Diagnostics-172Case-Windows-x64-LAB-R5
          path: desktop/dist/*.exe
          retention-days: 14
          if-no-files-found: error
