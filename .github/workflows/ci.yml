name: SquachEmit CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  host-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node --check web-installer/app.js
      - run: node tests/test_installer_ui.cjs
      - run: node tests/test_serial_baud.cjs
      - run: python tools/generate_vectors.py && git diff --exit-code tests/offline_vectors.json
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - name: Build S3 LAB firmware and stage all flash parts
        run: |
          set -euo pipefail
          pio run -e esp32-s3-devkitc-1
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" .pio/build/esp32-s3-devkitc-1/ota_init.bin
          test "$(stat -c%s .pio/build/esp32-s3-devkitc-1/ota_init.bin)" -eq 8192
          test -s .pio/build/esp32-s3-devkitc-1/bootloader.bin
          test -s .pio/build/esp32-s3-devkitc-1/partitions.bin
      - uses: actions/upload-artifact@v4
        with:
          name: squachemit-esp32s3-firmware-unverified
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
            .pio/build/esp32-s3-devkitc-1/ota_init.bin
          if-no-files-found: error
