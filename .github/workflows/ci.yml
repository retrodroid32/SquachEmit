name: SquachEmit CI
on:
  push:
  pull_request:
  workflow_dispatch:
# Keep only the newest lab build for a branch/PR while iterating.
concurrency:
  group: squachemit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/generate_vectors.py && git diff --exit-code tests/offline_vectors.json
      - run: python tools/score_trials.py tests/trials.csv --output /tmp/sqe-trials.md --json /tmp/sqe-trials.json
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e esp32-s3-devkitc-1
      - uses: actions/upload-artifact@v4
        with:
          name: squachemit-esp32s3-firmware-unverified
          path: .pio/build/esp32-s3-devkitc-1/firmware.bin
          if-no-files-found: error

  firmware-waveshare-c5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install verified ESP32-C5 Arduino core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "NimBLE-Arduino@2.5.1"
      - name: Build Waveshare ESP32-C5 touch firmware
        run: |
          arduino-cli compile --fqbn "esp32:esp32:esp32c5:FlashSize=16M,PSRAM=enabled,PartitionScheme=app3M_fat9M_16MB" \
            --build-property "build.extra_flags=-DSQE_WAVESHARE_C5=1 -I${GITHUB_WORKSPACE}/include" \
            --libraries "${GITHUB_WORKSPACE}/lib" \
            --output-dir "${GITHUB_WORKSPACE}/dist/c5" .
      - uses: actions/upload-artifact@v4
        with:
          name: squachemit-waveshare-c5-28-firmware-unverified
          path: dist/c5/*
          if-no-files-found: error
