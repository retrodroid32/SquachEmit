name: Render README UI animations from firmware C++ source
on:
  push:
    branches:
      - docs/squachemit-animated-readme-20261110
    paths:
      - tools/readme_capture/**
      - .github/workflows/readme-animated-demo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow==11.3.0
      - name: Compile actual SquachEmit CYD 3.2 C++ UI and generate GIFs
        run: python tools/readme_capture/generate.py --verify
      - name: Commit verified GIFs on the docs PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/squachemit-demo.gif docs/squachemit-device-library.gif docs/squachemit-test-running.gif
          if git diff --staged --quiet; then
            echo "Animated graphics unchanged"
          else
            git commit -m "Docs: capture animated SquachEmit firmware UI directly from C++"
            git push origin HEAD:docs/squachemit-animated-readme-20261110
          fi
